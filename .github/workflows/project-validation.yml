name: Project validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Validation executes code from pull requests, including forks. It only needs
# read access; generated assets are checked, never pushed back by CI.
permissions:
  contents: read

jobs:
  validate:
    name: Python and Godot validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.6.0"
          use-dotnet: false

      - name: Install Blender and Pillow
        run: |
          curl -fsSL https://download.blender.org/release/Blender3.6/blender-3.6.23-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
          echo "/tmp/blender-3.6.23-linux-x64" >> "$GITHUB_PATH"
          python -m pip install Pillow

      - name: Rebuild desktop showcase models
        run: |
          blender --background --threads 1 --factory-startup --python tools/models/build_hardware.py
          python tools/models/build_room.py

      - name: Validate generated showcase GLBs
        run: python tests/test_showcase_models.py -v

      - name: Ensure generated GLBs match committed assets
        run: |
          git diff --exit-code -- 'assets/models/hardware/*.glb' 'assets/models/room/*.glb'

      - name: Run Python importer tests
        run: python -m unittest discover -s tests -p "test_catalog_importer.py" -v

      - name: Import Godot resources
        run: godot --headless --path . --editor --import

      - name: Audit repository resources
        run: |
          python tools/project_audit.py
          python tools/catalog/import_games.py --project . --check

      - name: Run Godot headless regressions
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            tests/test_catalog_resources.gd \
            tests/test_catalog_integration.gd \
            tests/test_client.gd \
            tests/test_store.gd \
            tests/test_editor_scenes.gd \
            tests/life/test_life_flow.gd \
            tests/life/test_workstation_view.gd \
            tests/life/test_workstation_lighting.gd \
            tests/life/test_workstation_layout.gd \
            tests/life/test_workstation_collision.gd \
            tests/life/test_pixel_room.gd \
            tests/life/test_audit_regressions.gd
          do
            echo "Running $test"
            timeout 45s godot --headless --path . --script "res://$test" -- --fresh
          done

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run graphical window regression
        env:
          SDL_AUDIODRIVER: dummy
        run: xvfb-run -a godot --path . --script res://tests/test_client_windows.gd -- --fresh
