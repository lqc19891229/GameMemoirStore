name: Project validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python and Godot validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      statuses: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.6.0"
          use-dotnet: false

      - name: Install Blender and Pillow for same-repository PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          python -m pip install Pillow

      - name: Rebuild desktop showcase models
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          blender --background --threads 1 --factory-startup --python tools/models/build_hardware.py
          python tools/models/build_room.py

      - name: Validate generated showcase GLBs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: python tests/test_showcase_models.py -v

      - name: Run Python importer tests
        run: python -m unittest discover -s tests -p "test_catalog_importer.py" -v

      - name: Import Godot resources
        run: godot --headless --path . --editor --import

      - name: Audit repository resources
        run: |
          python tools/project_audit.py
          python tools/catalog/import_games.py --project . --check

      - name: Run Godot headless regressions
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            tests/test_catalog_resources.gd \
            tests/test_catalog_integration.gd \
            tests/test_client.gd \
            tests/test_store.gd \
            tests/test_editor_scenes.gd \
            tests/life/test_life_flow.gd \
            tests/life/test_workstation_view.gd \
            tests/life/test_workstation_layout.gd \
            tests/life/test_workstation_collision.gd \
            tests/life/test_pixel_room.gd \
            tests/life/test_audit_regressions.gd
          do
            echo "Running $test"
            godot --headless --path . --script "res://$test" -- --fresh
          done

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run graphical window regression
        env:
          SDL_AUDIODRIVER: dummy
        run: xvfb-run -a godot --path . --script res://tests/test_client_windows.gd -- --fresh

      - name: Commit regenerated model assets
        id: commit_assets
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/models/hardware.blend assets/models/hardware/*.glb assets/models/room/*.glb
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "assets: generate desktop showcase models"
          git push origin "HEAD:${BRANCH_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Mark regenerated model commit as validated
        if: steps.commit_assets.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_SHA: ${{ steps.commit_assets.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPOSITORY}/statuses/${NEW_SHA}" \
            -d '{"state":"success","context":"Python and Godot validation","description":"Regenerated desktop showcase GLBs passed bounds, import and regression tests."}'
