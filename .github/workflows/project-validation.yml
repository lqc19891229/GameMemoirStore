name: Project validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Validation executes code from pull requests, including forks. It only needs
# read access; generated assets are checked, never pushed back by CI.
permissions:
  contents: read

jobs:
  validate:
    name: Python and Godot validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Godot 4.6
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.6.0"
          use-dotnet: false

      - name: Install Blender and Pillow
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/blender.tar.xz
          downloaded=false
          for url in \
            https://mirror.blender.org/release/Blender3.6/blender-3.6.23-linux-x64.tar.xz \
            https://ftp.blender.org/release/Blender3.6/blender-3.6.23-linux-x64.tar.xz \
            https://download.blender.org/release/Blender3.6/blender-3.6.23-linux-x64.tar.xz
          do
            echo "Trying Blender mirror: $url"
            if curl --fail --location --retry 2 --retry-delay 3 --connect-timeout 20 \
              --user-agent "Mozilla/5.0 (compatible; GameMemoirStore-CI/1.0)" \
              "$url" --output "$archive"; then
              downloaded=true
              break
            fi
            rm -f "$archive"
          done
          if [ "$downloaded" != true ]; then
            echo "::error::Could not download Blender 3.6.23 from the official mirrors."
            exit 1
          fi
          tar -xf "$archive" -C /tmp
          echo "/tmp/blender-3.6.23-linux-x64" >> "$GITHUB_PATH"
          python -m pip install Pillow

      - name: Rebuild desktop showcase models
        run: |
          blender --background --threads 1 --factory-startup --python tools/models/build_hardware.py
          python tools/models/build_room.py

      - name: Validate generated showcase GLBs
        run: python tests/test_showcase_models.py -v

      - name: Upload regenerated showcase models
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-showcase-models
          path: |
            assets/models/hardware/*.glb
            assets/models/room/*.glb
            tools/models/hardware.blend
          if-no-files-found: error
          retention-days: 7

      - name: Report generated model drift and restore committed assets
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- 'assets/models/hardware/*.glb' 'assets/models/room/*.glb'; then
            echo "Generated GLBs match committed assets."
          else
            echo "::warning::Generated GLBs differ from committed runtime assets. See the regenerated-showcase-models artifact."
            git diff --stat -- 'assets/models/hardware/*.glb' 'assets/models/room/*.glb'
          fi
          git restore --source=HEAD --worktree -- tools/models/hardware.blend assets/models/hardware assets/models/room

      - name: Run Python importer tests
        run: python -m unittest discover -s tests -p "test_catalog_importer.py" -v

      - name: Import Godot resources
        run: godot --headless --path . --editor --import

      - name: Audit repository resources
        run: |
          python tools/project_audit.py
          python tools/catalog/import_games.py --project . --check

      - name: Run Godot headless regressions
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            tests/test_catalog_resources.gd \
            tests/test_catalog_integration.gd \
            tests/test_client.gd \
            tests/test_store.gd \
            tests/test_editor_scenes.gd \
            tests/life/test_life_flow.gd \
            tests/life/test_item_system.gd \
            tests/life/test_room_placement.gd \
            tests/life/test_workstation_view.gd \
            tests/life/test_workstation_lighting.gd \
            tests/life/test_workstation_layout.gd \
            tests/life/test_workstation_collision.gd \
            tests/life/test_modern_room.gd \
            tests/life/test_audit_regressions.gd
          do
            echo "Running $test"
            timeout 45s godot --headless --path . --script "res://$test" -- --fresh
          done

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Capture modern room preview
        env:
          SDL_AUDIODRIVER: dummy
        run: xvfb-run -a godot --path . --script res://tests/life/render_modern_room_preview.gd -- --fresh

      - name: Upload modern room preview
        uses: actions/upload-artifact@v4
        with:
          name: modern-room-preview
          path: modern-room-preview.png
          if-no-files-found: error
          retention-days: 7

      - name: Run graphical window regression
        env:
          SDL_AUDIODRIVER: dummy
        run: xvfb-run -a godot --path . --script res://tests/test_client_windows.gd -- --fresh
