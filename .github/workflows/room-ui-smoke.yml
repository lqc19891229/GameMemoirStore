name: Room UI smoke checks
on:
  pull_request:
    paths:
      - "addons/furniture_manager/**"
      - "tests/life/test_furniture_support_authoring.gd"
      - "tests/life/test_furniture_drag_handles.gd"
      - "tests/life/test_furniture_model_import.gd"
      - "tests/life/test_furniture_catalog_registration.gd"
      - "tests/life/test_room_save_recovery.gd"
      - "tests/life/test_furniture_resource_manager.gd"
      - "project.godot"
      - "scripts/life/room_*"
      - "scripts/life/computer_desktop.gd"
      - "scripts/life/browser.gd"
      - "scripts/life/game_session.gd"
      - "scripts/items/inventory_data.gd"
      - "scenes/apps/browser/**"
      - "tests/life/test_shop_room_flow.gd"
      - "scripts/life/workstation_layout.gd"
      - "scripts/life/workstation_3d.gd"
      - "scripts/room/room_view.gd"
      - "scripts/room/room_furniture.gd"
      - "scripts/room/furniture_support_surfaces.gd"
      - "scripts/items/furniture_finishes.gd"
      - "tests/life/test_room_support_surfaces.gd"
      - "tests/life/test_room_surface_mounts.gd"
      - "tests/life/test_room_wall_mounts.gd"
      - "tests/life/test_room_wall_sconce.gd"
      - "scenes/room/wall_sconce.tscn"
      - "scripts/room/room_wall_mount_data.gd"
      - "scripts/life/room_ui_icons.gd"
      - "scripts/room/room_wall_mount_data.gd"
      - "scripts/room/furniture_mount_data.gd"
      - "scenes/room/desk_memento.tscn"
      - "scenes/room/mini_book_stack.tscn"
      - "data/items/_catalog.tres"
      - "scripts/life/life_data.gd"
      - "scripts/room/modern_room_shell.gd"
      - "scenes/computer/workstation_3d.tscn"
      - "tests/life/test_room_cinematic.gd"
      - "tests/life/test_room_art_direction.gd"
      - "tests/life/test_room_p44_ambience.gd"
      - "tests/life/test_furniture_direct_interaction.gd"
      - "tests/life/test_furniture_batch.gd"
      - "tests/life/test_furniture_batch_repeat.gd"
      - "tests/life/test_furniture_copy_preview_clicks.gd"
      - "assets/room_minimal_theme.tres"
      - "tests/life/test_room_minimal_ui.gd"
      - "assets/models/room/catalog/*.glb"
      - "tests/life/test_room_decor_collectibles.gd"
      - "tests/life/test_furniture_pbr.gd"
      - "tests/life/test_workstation_view.gd"
      - "tests/life/test_desk_basic_workstation.gd"
      - "scenes/computer/computer_desktop.tscn"
      - ".github/workflows/room-ui-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  room-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false
      - name: Import all GLB and Godot resources
        run: godot --headless --path . --editor --import
      - name: Run compact room UI and core 3D interaction regressions
        run: |
          set -euo pipefail
          for test in \
            tests/life/test_desk_basic_workstation.gd \
            tests/life/test_room_support_surfaces.gd \
            tests/life/test_room_surface_mounts.gd \
            tests/life/test_room_wall_mounts.gd \
            tests/life/test_room_wall_sconce.gd \
            tests/life/test_room_minimal_ui.gd \
            tests/life/test_room_cinematic.gd \
            tests/life/test_room_art_direction.gd \
            tests/life/test_room_p44_ambience.gd \
            tests/life/test_furniture_catalog.gd \
            tests/life/test_furniture_resource_manager.gd \
            tests/life/test_furniture_support_authoring.gd \
            tests/life/test_furniture_drag_handles.gd \
            tests/life/test_furniture_model_import.gd \
            tests/life/test_furniture_catalog_registration.gd \
            tests/life/test_room_save_recovery.gd \
            tests/life/test_room_decor_collectibles.gd \
            tests/life/test_shop_room_flow.gd \
            tests/life/test_furniture_pbr.gd \
            tests/life/test_furniture_showcase.gd \
            tests/life/test_workstation_layout.gd \
            tests/life/test_furniture_direct_interaction.gd \
            tests/life/test_furniture_assists.gd \
            tests/life/test_furniture_batch.gd \
            tests/life/test_furniture_batch_repeat.gd \
            tests/life/test_workstation_collision.gd \
            tests/life/test_workstation_view.gd
          do
            echo "Running $test"
            timeout 45s godot --headless --path . --script "res://$test" -- --fresh
          done
