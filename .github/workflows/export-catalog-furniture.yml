name: Export P14 furniture GLB assets
on:
  push:
    branches:
      - feat/catalog-furniture-glb-20261102
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false
      - name: Import existing 3D project resources
        run: godot --headless --path . --editor --import
      - name: Export twenty authored furniture models to actual GLB assets
        run: godot --headless --path . --script res://tools/models/export_catalog_furniture.gd -- --fresh
      - name: Check output files
        run: |
          files=(assets/models/room/catalog/*.glb)
          test "${#files[@]}" -eq 20
          python - <<'PY'
          from pathlib import Path
          for f in Path("assets/models/room/catalog").glob("*.glb"):
              assert f.read_bytes()[:4] == b"glTF", f
          PY
      - name: Commit exported binary assets to the authoring branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/room/catalog/*.glb
          if ! git diff --cached --quiet; then
            git commit -m "assets(room): check in twenty exported furniture GLB models"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
